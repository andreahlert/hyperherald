<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="_hyperstream trace mark, animated">
  <style>
    .wire { fill: #0b0b0b; }
    .bracket { fill: none; stroke: #0b0b0b; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; transform-origin: 70px 48px; animation: pulse 1.6s ease-out infinite; }
    .d1 { animation: flow 1.6s linear infinite; animation-delay: 0s; }
    .d2 { animation: flow 1.6s linear infinite; animation-delay: 0.4s; }
    .d3 { animation: flow 1.6s linear infinite; animation-delay: 0.8s; }
    .d4 { animation: flow 1.6s linear infinite; animation-delay: 1.2s; }
    @keyframes flow {
      0%   { transform: translateX(-12px); r: 2.2; opacity: 0.0; }
      15%  { opacity: 0.4; }
      55%  { transform: translateX(24px); r: 4.2; opacity: 0.9; }
      85%  { transform: translateX(36px); r: 5; opacity: 1; }
      100% { transform: translateX(48px); r: 0; opacity: 0; }
    }
    @keyframes pulse {
      0%, 60% { transform: scale(1); stroke-width: 6; }
      72%     { transform: scale(1.12); stroke-width: 6.5; }
      100%    { transform: scale(1); stroke-width: 6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bracket, .d1, .d2, .d3, .d4 { animation: none; }
    }
  </style>
  <g class="bracket">
    <path d="M58 22 L82 48 L58 74"/>
  </g>
  <g class="wire">
    <circle class="d1" cx="12" cy="48" r="2.2"/>
    <circle class="d2" cx="12" cy="48" r="2.2"/>
    <circle class="d3" cx="12" cy="48" r="2.2"/>
    <circle class="d4" cx="12" cy="48" r="2.2"/>
  </g>
</svg>
