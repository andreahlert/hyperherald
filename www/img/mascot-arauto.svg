<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="_hyperherald mascot — pixel arauto" style="image-rendering: pixelated;">

  <!-- background transparent -->

  <!-- chapeu de mago navy cone com curl direita -->
  <g fill="#1a2a4a">
    <rect x="17" y="0" width="1" height="1"/>
    <rect x="16" y="1" width="2" height="1"/>
    <rect x="15" y="2" width="3" height="1"/>
    <rect x="14" y="3" width="4" height="1"/>
    <rect x="13" y="4" width="5" height="1"/>
    <rect x="12" y="5" width="7" height="1"/>
  </g>

  <!-- highlight navy claro lado esquerdo cone -->
  <g fill="#3a5599">
    <rect x="16" y="1" width="1" height="1"/>
    <rect x="15" y="2" width="1" height="1"/>
    <rect x="14" y="3" width="1" height="1"/>
    <rect x="13" y="4" width="1" height="1"/>
    <rect x="12" y="5" width="1" height="1"/>
  </g>

  <!-- estrela amarela pequena no cone -->
  <g fill="#f4d35e">
    <rect x="16" y="3" width="1" height="1"/>
    <rect x="15" y="4" width="1" height="1"/>
    <rect x="17" y="4" width="1" height="1"/>
    <rect x="16" y="5" width="1" height="1"/>
  </g>

  <!-- brim band azul Mac -->
  <g fill="#4a84c4">
    <rect x="10" y="6" width="12" height="1"/>
  </g>

  <!-- fivela dourada centro brim -->
  <g fill="#d4a843">
    <rect x="15" y="6" width="2" height="1"/>
  </g>

  <!-- fivela furo central -->
  <g fill="#1a2a4a">
    <rect x="15" y="6" width="1" height="1" opacity="0"/>
  </g>

  <!-- brim borda navy externa -->
  <g fill="#1a2a4a">
    <rect x="9" y="6" width="1" height="1"/>
    <rect x="22" y="6" width="1" height="1"/>
  </g>

  <!-- rosto skin -->
  <g fill="#f4c896">
    <rect x="12" y="7" width="8" height="1"/>
    <rect x="12" y="8" width="2" height="1"/>
    <rect x="15" y="8" width="2" height="1"/>
    <rect x="18" y="8" width="2" height="1"/>
    <rect x="12" y="9" width="8" height="1"/>
    <rect x="12" y="10" width="3" height="1"/>
    <rect x="17" y="10" width="3" height="1"/>
    <rect x="13" y="11" width="6" height="1"/>
  </g>

  <!-- olhos + boca -->
  <g fill="#1a1208">
    <rect x="14" y="8" width="1" height="1"/>
    <rect x="17" y="8" width="1" height="1"/>
    <rect x="15" y="10" width="2" height="1"/>
  </g>

  <!-- pescoço -->
  <g fill="#e0b285">
    <rect x="14" y="11" width="1" height="1"/>
    <rect x="19" y="11" width="1" height="1"/>
  </g>

  <!-- tabardo azul Mac -->
  <g fill="#4a84c4">
    <rect x="10" y="12" width="12" height="1"/>
    <rect x="9"  y="13" width="14" height="1"/>
    <rect x="8"  y="14" width="16" height="1"/>
    <rect x="8"  y="15" width="16" height="1"/>
    <rect x="8"  y="16" width="16" height="1"/>
    <rect x="8"  y="17" width="16" height="1"/>
    <rect x="8"  y="18" width="16" height="1"/>
    <rect x="8"  y="19" width="16" height="1"/>
    <rect x="8"  y="20" width="16" height="1"/>
    <rect x="8"  y="21" width="16" height="1"/>
    <rect x="8"  y="22" width="16" height="1"/>
    <rect x="9"  y="23" width="14" height="1"/>
    <rect x="10" y="24" width="12" height="1"/>
  </g>

  <!-- símbolo </> branco no tabardo (htmx-style) -->
  <g fill="#ffffff">
    <!-- < -->
    <rect x="14" y="16" width="1" height="1"/>
    <rect x="13" y="17" width="1" height="1"/>
    <rect x="12" y="18" width="1" height="1"/>
    <rect x="13" y="19" width="1" height="1"/>
    <rect x="14" y="20" width="1" height="1"/>
    <!-- / slash diagonal -->
    <rect x="15" y="21" width="1" height="1"/>
    <rect x="16" y="20" width="1" height="1"/>
    <rect x="16" y="19" width="1" height="1"/>
    <rect x="17" y="18" width="1" height="1"/>
    <rect x="17" y="17" width="1" height="1"/>
    <rect x="18" y="16" width="1" height="1"/>
    <rect x="18" y="15" width="1" height="1"/>
    <!-- > -->
    <rect x="19" y="16" width="1" height="1"/>
    <rect x="20" y="17" width="1" height="1"/>
    <rect x="21" y="18" width="1" height="1"/>
    <rect x="20" y="19" width="1" height="1"/>
    <rect x="19" y="20" width="1" height="1"/>
  </g>

  <!-- sombra tabardo (azul escuro) borda baixo -->
  <g fill="#2a5080">
    <rect x="8"  y="22" width="16" height="1" opacity="0"/>
    <rect x="9"  y="24" width="14" height="1"/>
    <rect x="10" y="25" width="12" height="1"/>
  </g>

  <!-- pernas (calçao) -->
  <g fill="#1a1208">
    <rect x="11" y="25" width="3" height="3"/>
    <rect x="18" y="25" width="3" height="3"/>
    <rect x="10" y="28" width="5" height="1"/>
    <rect x="17" y="28" width="5" height="1"/>
  </g>

  <!-- trompete cano dourado -->
  <g fill="#d4a843">
    <rect x="20" y="13" width="6" height="1"/>
    <rect x="20" y="14" width="6" height="1"/>
    <rect x="26" y="11" width="1" height="6"/>
    <rect x="27" y="10" width="1" height="8"/>
    <rect x="28" y="9"  width="1" height="10"/>
    <rect x="29" y="8"  width="1" height="12"/>
    <rect x="30" y="9"  width="1" height="10"/>
  </g>

  <!-- trompete sombra -->
  <g fill="#8a6826">
    <rect x="20" y="15" width="6" height="1"/>
    <rect x="26" y="15" width="1" height="2"/>
    <rect x="27" y="17" width="1" height="1"/>
    <rect x="28" y="18" width="1" height="1"/>
    <rect x="29" y="19" width="1" height="1"/>
  </g>

  <!-- estandarte vermelho pendurado -->
  <g fill="#c8412c">
    <rect x="21" y="16" width="5" height="1"/>
    <rect x="21" y="17" width="5" height="1"/>
    <rect x="21" y="18" width="5" height="1"/>
    <rect x="21" y="19" width="5" height="1"/>
    <rect x="21" y="20" width="5" height="1"/>
    <rect x="21" y="21" width="1" height="1"/>
    <rect x="23" y="21" width="1" height="1"/>
    <rect x="25" y="21" width="1" height="1"/>
  </g>

  <!-- letra H branca no estandarte -->
  <g fill="#ffffff">
    <rect x="22" y="17" width="1" height="3"/>
    <rect x="24" y="17" width="1" height="3"/>
    <rect x="22" y="18" width="3" height="1"/>
  </g>

  <!-- sombra estandarte (vermelho escuro) -->
  <g fill="#7a1721">
    <rect x="25" y="17" width="1" height="3"/>
    <rect x="21" y="20" width="5" height="1" opacity="0"/>
  </g>

  <!-- cordao do estandarte ao trompete -->
  <g fill="#8a6826">
    <rect x="25" y="15" width="1" height="1"/>
  </g>

</svg>
