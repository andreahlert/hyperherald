<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img" aria-label="pixel herald icon">
  <!-- cap accent -->
  <rect x="18" y="4" width="20" height="2" fill="#1a1a1a"/>
  <!-- cap dome -->
  <rect x="18" y="6" width="20" height="12" fill="#2c478a"/>
  <!-- floppy left point -->
  <rect x="10" y="10" width="8" height="4" fill="#2c478a"/>
  <rect x="8"  y="12" width="4" height="6" fill="#2c478a"/>
  <rect x="6"  y="16" width="4" height="4" fill="#ffd166"/>
  <!-- gold band -->
  <rect x="16" y="16" width="24" height="4" fill="#ffd166"/>
  <rect x="16" y="16" width="24" height="2" fill="#1a1a1a"/>

  <!-- face -->
  <rect x="20" y="20" width="16" height="12" fill="#dcdad2"/>
  <!-- eyes -->
  <rect x="23" y="24" width="2" height="2" fill="#1a1a1a"/>
  <rect x="31" y="24" width="2" height="2" fill="#1a1a1a"/>
  <!-- mouth -->
  <rect x="26" y="28" width="4" height="2" fill="#1a1a1a"/>

  <!-- collar gold -->
  <rect x="18" y="32" width="20" height="2" fill="#ffd166"/>
  <rect x="18" y="32" width="20" height="1" fill="#1a1a1a"/>

  <!-- tabard -->
  <rect x="16" y="34" width="24" height="22" fill="#1a2a5c"/>
  <rect x="14" y="34" width="2"  height="22" fill="#1a1a1a"/>
  <rect x="40" y="34" width="2"  height="22" fill="#1a1a1a"/>
  <rect x="14" y="56" width="28" height="2"  fill="#1a1a1a"/>

  <!-- crest shield -->
  <rect x="22" y="38" width="12" height="14" fill="#ffd166"/>
  <rect x="22" y="38" width="12" height="2"  fill="#1a1a1a"/>
  <rect x="22" y="50" width="12" height="2"  fill="#1a1a1a"/>
  <!-- H mark -->
  <g fill="#1a1a1a">
    <rect x="24" y="40" width="2" height="10"/>
    <rect x="30" y="40" width="2" height="10"/>
    <rect x="26" y="44" width="4" height="2"/>
  </g>

  <!-- trumpet -->
  <rect x="36" y="24" width="12" height="4" fill="#ffd166"/>
  <rect x="36" y="22" width="12" height="2" fill="#1a1a1a"/>
  <rect x="36" y="28" width="12" height="2" fill="#1a1a1a"/>
  <!-- bell -->
  <rect x="48" y="20" width="4" height="12" fill="#ffd166"/>
  <rect x="48" y="18" width="4" height="2" fill="#1a1a1a"/>
  <rect x="48" y="32" width="4" height="2" fill="#1a1a1a"/>
  <rect x="52" y="18" width="2" height="16" fill="#1a1a1a"/>

  <!-- sound chevrons -->
  <g fill="#ffd166">
    <rect x="56" y="22" width="3" height="3"/>
    <rect x="59" y="25" width="3" height="3"/>
    <rect x="56" y="28" width="3" height="3" opacity="0.6"/>
  </g>
</svg>
