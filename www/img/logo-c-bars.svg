<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="_hyperherald — replay-buffer bars concept">
  <g transform="translate(24,32)">
    <!-- replay buffer frames (bars), shortest = newest, opacity step -->
    <rect x="0"  y="6"  width="76" height="10" rx="5" fill="#00B8B8" opacity="0.25"/>
    <rect x="0"  y="28" width="60" height="10" rx="5" fill="#00B8B8" opacity="0.55"/>
    <rect x="0"  y="50" width="44" height="10" rx="5" fill="#00B8B8"/>
    <!-- underscore -->
    <line x1="0" y1="84" x2="76" y2="84" stroke="#00B8B8" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="124" y="108" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="56" fill="#00B8B8" font-weight="600" letter-spacing="-1">_hyperherald</text>
</svg>
