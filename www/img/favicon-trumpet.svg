<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="_hyperherald trumpet with banner" style="image-rendering: pixelated;">

  <!-- corneta dourada -->
  <g fill="#d4a843">
    <rect x="1" y="3" width="8" height="3"/>
    <rect x="9" y="2" width="1" height="5"/>
    <rect x="10" y="1" width="1" height="7"/>
    <rect x="11" y="0" width="1" height="9"/>
    <rect x="13" y="1" width="1" height="7"/>
    <rect x="14" y="2" width="1" height="5"/>
  </g>

  <!-- bocal -->
  <g fill="#b88a2c">
    <rect x="0" y="2" width="2" height="1"/>
    <rect x="0" y="6" width="2" height="1"/>
    <rect x="1" y="3" width="1" height="3"/>
  </g>

  <!-- sombra corneta -->
  <g fill="#8a6826">
    <rect x="2" y="6" width="7" height="1"/>
    <rect x="9" y="7" width="1" height="1"/>
    <rect x="10" y="8" width="1" height="1"/>
    <rect x="11" y="9" width="1" height="1"/>
    <rect x="13" y="8" width="1" height="1"/>
    <rect x="14" y="7" width="1" height="1"/>
  </g>

  <!-- brilho topo -->
  <g fill="#f4d35e">
    <rect x="2" y="3" width="6" height="1"/>
  </g>

  <!-- cordão -->
  <g fill="#8a6826">
    <rect x="6" y="7" width="1" height="1"/>
  </g>

  <!-- estandarte vermelho pendurado -->
  <g fill="#c8412c">
    <rect x="4" y="8" width="5" height="6"/>
  </g>

  <!-- letra H branca -->
  <g fill="#ffffff">
    <rect x="5" y="9" width="1" height="4"/>
    <rect x="7" y="9" width="1" height="4"/>
    <rect x="6" y="10" width="1" height="2"/>
  </g>

  <!-- recorte triangular base estandarte (transparente via cobertura branca... usar dark) -->
  <g fill="#7a1721">
    <rect x="8" y="13" width="1" height="1"/>
    <rect x="4" y="13" width="1" height="1"/>
  </g>

  <!-- ponta triangular vermelha embaixo (banner forquilha) -->
  <g fill="#c8412c">
    <rect x="5" y="14" width="1" height="1"/>
    <rect x="7" y="14" width="1" height="1"/>
  </g>

  <!-- sombra direita estandarte -->
  <g fill="#7a1721">
    <rect x="8" y="9" width="1" height="4"/>
  </g>

</svg>
