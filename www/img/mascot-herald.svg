<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 144" shape-rendering="crispEdges" role="img" aria-label="pixel-art medieval herald sounding a trumpet with hyperherald chevrons">
  <!-- banner pole -->
  <rect x="56" y="0" width="4" height="40" fill="#1a1a1a"/>
  <!-- pennant cloth -->
  <rect x="60" y="4" width="40" height="20" fill="#2c478a"/>
  <rect x="60" y="4" width="40" height="2" fill="#1a1a1a"/>
  <rect x="60" y="22" width="40" height="2" fill="#1a1a1a"/>
  <!-- pennant fork tail -->
  <rect x="100" y="4" width="2" height="2" fill="#1a1a1a"/>
  <rect x="100" y="22" width="2" height="2" fill="#1a1a1a"/>
  <rect x="100" y="6" width="2" height="16" fill="#2c478a"/>
  <!-- chevrons on pennant -->
  <g fill="#ffd166">
    <rect x="68" y="9" width="4" height="4"/>
    <rect x="72" y="13" width="4" height="4"/>
    <rect x="68" y="17" width="4" height="4"/>
    <rect x="84" y="9" width="4" height="4"/>
    <rect x="88" y="13" width="4" height="4"/>
    <rect x="84" y="17" width="4" height="4"/>
  </g>

  <!-- cap top accent -->
  <rect x="76" y="36" width="40" height="4" fill="#1a1a1a"/>
  <!-- herald cap dome -->
  <rect x="76" y="40" width="40" height="20" fill="#2c478a"/>
  <!-- cap floppy left point -->
  <rect x="60" y="44" width="16" height="8" fill="#2c478a"/>
  <rect x="56" y="48" width="8" height="12" fill="#2c478a"/>
  <!-- pompom on point -->
  <rect x="52" y="56" width="8" height="8" fill="#ffd166"/>
  <!-- cap gold band -->
  <rect x="72" y="56" width="48" height="6" fill="#ffd166"/>
  <rect x="72" y="56" width="48" height="2" fill="#1a1a1a"/>
  <rect x="72" y="60" width="48" height="2" fill="#1a1a1a"/>

  <!-- face -->
  <rect x="80" y="62" width="32" height="22" fill="#dcdad2"/>
  <!-- eyes -->
  <rect x="86" y="70" width="4" height="4" fill="#1a1a1a"/>
  <rect x="100" y="70" width="4" height="4" fill="#1a1a1a"/>
  <!-- mouth, open blowing trumpet -->
  <rect x="92" y="78" width="8" height="4" fill="#1a1a1a"/>

  <!-- neck and gold chain of office -->
  <rect x="80" y="84" width="32" height="4" fill="#dcdad2"/>
  <rect x="76" y="88" width="40" height="4" fill="#ffd166"/>
  <rect x="76" y="88" width="40" height="2" fill="#1a1a1a"/>

  <!-- tabard body -->
  <rect x="64" y="92" width="64" height="36" fill="#1a2a5c"/>
  <rect x="60" y="92" width="4" height="36" fill="#1a1a1a"/>
  <rect x="128" y="92" width="4" height="36" fill="#1a1a1a"/>
  <rect x="60" y="128" width="72" height="4" fill="#1a1a1a"/>

  <!-- crest shield on tabard -->
  <rect x="78" y="98" width="36" height="24" fill="#ffd166"/>
  <rect x="78" y="98" width="36" height="2" fill="#1a1a1a"/>
  <rect x="78" y="120" width="36" height="2" fill="#1a1a1a"/>
  <rect x="78" y="98" width="2" height="24" fill="#1a1a1a"/>
  <rect x="112" y="98" width="2" height="24" fill="#1a1a1a"/>
  <!-- H mark on shield -->
  <g fill="#1a1a1a">
    <rect x="84" y="102" width="4" height="16"/>
    <rect x="104" y="102" width="4" height="16"/>
    <rect x="88" y="108" width="16" height="4"/>
  </g>

  <!-- left arm holding scroll -->
  <rect x="52" y="92" width="8" height="20" fill="#2c478a"/>
  <rect x="52" y="92" width="2" height="20" fill="#1a1a1a"/>
  <!-- scroll -->
  <rect x="32" y="100" width="24" height="20" fill="#dcdad2"/>
  <rect x="32" y="100" width="24" height="2" fill="#1a1a1a"/>
  <rect x="32" y="118" width="24" height="2" fill="#1a1a1a"/>
  <rect x="30" y="100" width="2" height="20" fill="#ffd166"/>
  <rect x="56" y="100" width="2" height="20" fill="#ffd166"/>
  <!-- scroll text lines -->
  <rect x="36" y="105" width="16" height="2" fill="#1a1a1a"/>
  <rect x="36" y="109" width="14" height="2" fill="#1a1a1a"/>
  <rect x="36" y="113" width="16" height="2" fill="#1a1a1a"/>
  <!-- wax seal -->
  <rect x="44" y="116" width="6" height="6" fill="#8b5a2b"/>

  <!-- right arm raised to trumpet -->
  <rect x="128" y="76" width="8" height="14" fill="#2c478a"/>
  <rect x="134" y="76" width="2" height="14" fill="#1a1a1a"/>

  <!-- trumpet mouthpiece touching mouth -->
  <rect x="108" y="78" width="12" height="6" fill="#ffd166"/>
  <rect x="108" y="76" width="12" height="2" fill="#1a1a1a"/>
  <rect x="108" y="84" width="12" height="2" fill="#1a1a1a"/>
  <!-- trumpet tube -->
  <rect x="120" y="78" width="36" height="6" fill="#ffd166"/>
  <rect x="120" y="76" width="36" height="2" fill="#1a1a1a"/>
  <rect x="120" y="84" width="36" height="2" fill="#1a1a1a"/>
  <!-- bell flare step 1 -->
  <rect x="156" y="74" width="6" height="14" fill="#ffd166"/>
  <rect x="156" y="72" width="6" height="2" fill="#1a1a1a"/>
  <rect x="156" y="88" width="6" height="2" fill="#1a1a1a"/>
  <!-- bell flare step 2 -->
  <rect x="162" y="68" width="8" height="26" fill="#ffd166"/>
  <rect x="162" y="66" width="8" height="2" fill="#1a1a1a"/>
  <rect x="162" y="94" width="8" height="2" fill="#1a1a1a"/>
  <rect x="170" y="66" width="2" height="30" fill="#1a1a1a"/>

  <!-- sound chevrons exiting trumpet -->
  <g fill="#ffd166">
    <rect x="180" y="70" width="6" height="6"/>
    <rect x="186" y="76" width="6" height="6"/>
    <rect x="180" y="82" width="6" height="6"/>

    <rect x="200" y="70" width="6" height="6" opacity="0.6"/>
    <rect x="206" y="76" width="6" height="6" opacity="0.6"/>
    <rect x="200" y="82" width="6" height="6" opacity="0.6"/>

    <rect x="220" y="70" width="6" height="6" opacity="0.3"/>
    <rect x="226" y="76" width="6" height="6" opacity="0.3"/>
    <rect x="220" y="82" width="6" height="6" opacity="0.3"/>
  </g>

  <!-- floating confetti -->
  <g>
    <rect x="12" y="16" width="4" height="4" fill="#2c478a"/>
    <rect x="20" y="40" width="4" height="4" fill="#ffd166"/>
    <rect x="16" y="76" width="4" height="4" fill="#ffffff"/>
    <rect x="232" y="20" width="4" height="4" fill="#2c478a"/>
    <rect x="216" y="36" width="4" height="4" fill="#ffd166"/>
    <rect x="232" y="108" width="4" height="4" fill="#ffffff"/>
  </g>
</svg>
