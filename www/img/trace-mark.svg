<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="_hyperherald trace mark">
  <!-- a horizontal wire with sequenced dots feeding into a closing-tag bracket -->
  <g fill="none" stroke="#0b0b0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- bracket > -->
    <path d="M58 22 L82 48 L58 74"/>
  </g>
  <g fill="#0b0b0b">
    <!-- seq dots, size grows toward the bracket (most recent = largest) -->
    <circle cx="12" cy="48" r="2.5" opacity="0.35"/>
    <circle cx="24" cy="48" r="3.25" opacity="0.55"/>
    <circle cx="36" cy="48" r="4"   opacity="0.80"/>
    <circle cx="48" cy="48" r="5"/>
  </g>
</svg>
